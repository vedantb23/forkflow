# docker-compose.yml
# A "recipe" file. Each service below is a container Docker will run for us.
# For now we only run Redis locally. (Postgres is on Supabase in the cloud.)
# We'll add backend + worker containers here on Day 7.

services:
  # -------- Redis: in-memory store used for cache, locks, and BullMQ queues --------
  redis:
    image: redis:7-alpine          # official Redis image, "alpine" = tiny Linux base
    container_name: forkflow-redis # a friendly name so `docker ps` is readable
    ports:
      - "6379:6379"                # map container port 6379 -> your PC's port 6379
    volumes:
      - redis_data:/data           # persist Redis data on disk so it survives restarts
    restart: unless-stopped        # auto-restart the container if it crashes

# Named volume where Redis stores its data (managed by Docker)
volumes:
  redis_data:
